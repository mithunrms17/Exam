<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Temporary File Vault</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f9f9f9; color: #333; }
        .box { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, button { padding: 10px; margin-top: 10px; width: 100%; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        ul { padding-left: 20px; }
        li { margin: 10px 0; }
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Upload a File</h2>
        <input type="file" id="fileInput">
        <button onclick="uploadFile()">Upload</button>
        <p id="status" style="font-weight: bold; margin-top: 10px;"></p>
    </div>

    <div class="box">
        <h2>Available Files</h2>
        <ul id="fileList">Loading files...</ul>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getStorage, ref, uploadBytes, listAll, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // REPLACE THIS WITH YOUR FIREBASE CONFIG FROM THE CONSOLE
        const firebaseConfig = {
            apiKey: "AIzaSyAsZL4ynUt7c5oQPXMKMCUGjmHXRmNf3FA",
            authDomain: "smart-worker-helmet.firebaseapp.com",
            databaseURL: "https://smart-worker-helmet-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "smart-worker-helmet",
            storageBucket: "smart-worker-helmet.firebasestorage.app",
            messagingSenderId: "425355245105",
            appId: "1:425355245105:web:03145b1a5efd6924da4710",
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);

        window.uploadFile = async function() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');
            if (fileInput.files.length === 0) {
                alert("Please select a file first!");
                return;
            }

            const file = fileInput.files[0];
            const storageRef = ref(storage, 'uploads/' + file.name);
            
            status.innerText = "Uploading...";
            try {
                await uploadBytes(storageRef, file);
                status.innerText = "Upload successful!";
                fileInput.value = "";
                loadFiles();
            } catch (error) {
                console.error(error);
                status.innerText = "Upload failed: " + error.message;
            }
        };

        async function loadFiles() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = "";
            const listRef = ref(storage, 'uploads/');

            try {
                const res = await listAll(listRef);
                if (res.items.length === 0) {
                    fileList.innerHTML = "<li>No files uploaded yet.</li>";
                    return;
                }

                for (const itemRef of res.items) {
                    const url = await getDownloadURL(itemRef);
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = url;
                    a.innerText = itemRef.name;
                    a.target = "_blank";
                    li.appendChild(a);
                    fileList.appendChild(li);
                }
            } catch (error) {
                console.error(error);
                fileList.innerHTML = "<li>Error loading files. Check Storage Rules.</li>";
            }
        }

        loadFiles();
    </script>
</body>
</html>
